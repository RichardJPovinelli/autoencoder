[project]
name = "autoencoder"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "RichardPovinelli", email = "richard.povinelli@gmail.com"},
    {name = "Richard J. Povinelli", email = "richard.povinelli@marquette.edu"},
]
dependencies = [
    "matplotlib",
    "numpy",
